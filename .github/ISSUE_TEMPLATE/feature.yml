name: Feature proposal
description: Propose a feature or contract change for Xenia
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should Xenia solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: dropdown
    id: modes
    attributes:
      label: Credential modes affected
      multiple: true
      options:
        - Trial
        - BYOK
        - Managed
        - All modes
        - Not applicable
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, and billing considerations
      description: Include trust boundaries, secret exposure, user consent, data handling, and billing ownership where relevant.
  - type: textarea
    id: interoperability
    attributes:
      label: Interoperability considerations
      description: Explain impact on tools, hosts, providers, manifests, or conformance profiles.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue or RFC covering this proposal.
          required: true
        - label: I have not included credentials, tokens, or sensitive data.
          required: true
